# YOLO11n - Standard baseline (no custom modules)
nc: 10
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]      # 6
  - [-1, 1, Conv, [512, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [512, True]]      # 8
  - [-1, 1, SPPF, [512, 5]]         # 9
  - [-1, 2, C2PSA, [512]]           # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 4], 1, Concat, [1]]                    # 12 - fuse P4(40x40) upsampled + P3(80x80)
  - [-1, 2, C3k2, [512, False]]                  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 2], 1, Concat, [1]]                    # 15 - fuse P3(80x80) upsampled + P2(160x160)
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3/8 output)

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18 - fuse stride2 + head P4
  - [-1, 2, C3k2, [512, False]]                  # 19 (P4/16 output)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 - fuse stride2 + backbone P5
  - [-1, 2, C3k2, [512, True]]                   # 22 (P5/32 output)

  - [[16, 19, 22], 1, Detect, [nc]]              # Detect(P3, P4, P5)
